services:
  # ============================================================================
  # Database Service (PostgreSQL 16)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: el_dugout_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-el_dugout_ve}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-el_dugout_ve}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ============================================================================
  # Database UI (Adminer - lightweight web interface for PostgreSQL)
  # Available at: http://localhost:8081
  # ============================================================================
  adminer:
    image: adminer:latest
    container_name: el_dugout_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - app_network

  # ============================================================================
  # Backend Service (NestJS API) - for containerized local testing
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: el_dugout_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-el_dugout_ve}?schema=public
      JWT_SECRET: ${JWT_SECRET:-supersecret-replace-with-secure-random-value-in-production}
      CORS_ORIGINS: "http://localhost:4200,http://localhost:8080,https://eldugoutve.com"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    profiles:
      - fullstack

  # ============================================================================
  # Frontend Service (Angular + Nginx) - for containerized local testing
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: el_dugout_frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - app_network
    profiles:
      - fullstack

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge
